<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alsauditech</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--bg2:#0a0f1c;--line:#1a2540;--blue:#1f6bff;--blue2:#4d8dff;--fg:#fff;--mut:#9aa6c0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:70px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"IBM Plex Sans Arabic",system-ui,Arial,sans-serif;line-height:1.7}
a{color:inherit;text-decoration:none}
.w{max-width:1040px;margin:auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(0,0,0,.85);z-index:4}
nav{display:flex;align-items:center;gap:18px;height:60px}
.logo{font-weight:700;letter-spacing:.5px;font-size:18px}
.logo b{color:var(--blue2)}
.links{display:flex;gap:16px;margin-inline-start:auto;font-size:14px;color:var(--mut);overflow-x:auto;white-space:nowrap}
.links a:hover{color:#fff}
button,.btn{font:inherit;cursor:pointer;border-radius:8px;padding:10px 18px;border:1px solid var(--blue);background:var(--blue);color:#fff;font-weight:500;display:inline-block}
.btn.o,button.o{background:transparent;color:#fff;border-color:#2b3a5e}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue2);outline-offset:2px}
.sm{padding:6px 12px;font-size:13px}
.hero{padding:84px 0 72px;background:radial-gradient(900px 340px at 80% 0,rgba(31,107,255,.28),transparent 70%)}
.hero h1{font-size:clamp(40px,9vw,84px);line-height:1.1;margin:0 0 18px;font-weight:700}
.hero h1 span{color:var(--blue2)}
.hero p{color:var(--mut);max-width:560px;font-size:18px;margin:0 0 28px}
.row{display:flex;gap:12px;flex-wrap:wrap}
section{padding:60px 0;border-top:1px solid var(--line)}
h2{font-size:30px;margin:0 0 10px}
.sub{color:var(--mut);margin:0 0 28px;max-width:620px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:24px}
.box h3{margin:0 0 12px;font-size:20px;color:var(--blue2)}
.box ul{margin:0;padding-inline-start:20px;color:#d7def0}
.box li{margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips span{border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:8px 16px;font-size:14px}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 28px}
.why p{margin:0;padding:14px 0;border-bottom:1px solid var(--line)}
form{display:grid;gap:12px;max-width:560px}
input,select,textarea{width:100%;font:inherit;background:#05080f;color:#fff;border:1px solid #2b3a5e;border-radius:8px;padding:11px 12px}
label{font-size:14px;color:var(--mut);display:grid;gap:4px}
.c{font-size:20px;direction:ltr;unicode-bidi:plaintext}
footer{border-top:1px solid var(--line);padding:36px 0;color:var(--mut);font-size:14px}
footer .links{margin:14px 0}
dialog{background:var(--bg2);color:#fff;border:1px solid #2b3a5e;border-radius:14px;padding:24px;width:min(420px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.7)}
#msg{color:var(--blue2);min-height:24px;margin:0}
</style>
</head>
<body>
<header><div class="w"><nav>

</div>

</nav></div></header>

<label><span data-t="f_det"></span><textarea name="d" rows="4" required></textarea></label>
<button type="submit" data-t="send"></button>

<section id="contact"><div class="w">

<p class="sub" data-t="con_p"></p>
<p><span data-t="wa"></span><br><a class="c" href="https://wa.me/249968251642" target="_blank" rel="noopener">+249968251642</a></p>
<p><span data-t="em"></span><br><a class="c" href="mailto:muhammedahmedbashier@gmail.com">muhammedahmedbashier@gmail.com</a></p>
</div></section>
</main>

<footer><div class="w">
<div class="logo">ALSAUDI<b>TECH</b></div>
<div data-t="foot_p"></div>
<div class="links"><a href="#home" data-t="n_home"></a><a href="#services" data-t="n_services"></a><a href="#portfolio" data-t="n_portfolio"></a><a href="#contact" data-t="n_contact"></a></div>
<div>© 2026 ALSAUDITECH. All Rights Reserved.</div>
</div></footer>

<dialog id="login"><form method="dialog" onsubmit="return soon(event)">

<label><span data-t="l_user"></span><input required></label>
<label><span data-t="l_pass"></span><input type="password" required></label>
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto"><span data-t="remember"></span></label>
<button data-t="login"></button>
<p class="sub" data-note></p>
<button type="button" class="o" data-open="signup" data-t="signup2"></button>
</form></dialog>

<dialog id="signup"><form method="dialog" onsubmit="return soon(event)">

<label><span data-t="f_phone"></span><input type="tel" required></label>

<label><span data-t="l_pass2"></span><input type="password" required></label>

</form></dialog>

let L=localStorageGet()||"ar";
function localStorageGet(){try{return localStorage.getItem("l")}catch(e){return null}}
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
function render(){
const d=D[L];
document.documentElement.lang=L;document.documentElement.dir=L=="ar"?"rtl":"ltr";
$("#lang").textContent=L=="ar"?"EN":"عربي";
$$("[data-t]").forEach(e=>e.textContent=d[e.dataset.t]);
$$("[data-list]").forEach(e=>e.innerHTML=d[e.dataset.list].map(x=>"<li>"+x+"</li>").join(""));

$("#lang").onclick=()=>{L=L=="ar"?"en":"ar";try{localStorage.setItem("l",L)}catch(e){}render()};
$$("[data-open]").forEach(b=>b.onclick=()=>{$$("dialog").forEach(x=>x.close());$("#"+b.dataset.open).showModal()});

$("#rf").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);
